# tmux config — read natively from ~/.config/tmux/tmux.conf (tmux >= 3.1).
# Installed and kept current by the `tmux` role in the workstation repo, which
# also clones the plugins below at pinned commits. Nothing here touches the
# network at startup.

# --- prefix ------------------------------------------------------------------
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# --- core --------------------------------------------------------------------
set -g escape-time 10
set -g detach-on-destroy off        # closing a session switches to another
set -ag update-environment " PATH"
set -g focus-events on              # lets nvim autoread on pane focus
set -g mouse on

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:Tc"

# Required for image previews (yazi) and other escape-sequence passthrough.
set -g allow-passthrough on

set-option -g allow-rename off

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- windows / splits --------------------------------------------------------
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

bind c copy-mode
bind t new-window

# --- copy mode ---------------------------------------------------------------
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane   # don't exit copy mode on mouse release

# --- pane navigation ---------------------------------------------------------
# Deliberately decoupled from nvim: Ctrl+hjkl belongs to nvim splits, Alt+hjkl
# belongs to tmux panes. No vim-tmux-navigator on either side. Alt is used
# rather than Ctrl+Shift because VTE (gnome-terminal) sends the same byte for
# Ctrl+H and Ctrl+Shift+H, so tmux could never tell them apart.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+Shift+hjkl resizes.
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# --- sessions ----------------------------------------------------------------
bind-key f display-popup -w 80% -h 80% -E "tmux-sessionizer"
bind-key p switch-client -l
bind-key q confirm-before -p "Quit session #{session_name}?" "run-shell ~/.local/bin/tmux-quit-session"
bind-key K confirm-before -p "Kill session #{session_name}?" kill-session

# --- theme: Rose Pine (matches neovim-config and starship) -------------------
# bg=default keeps the terminal's transparency, same as nvim's disable_background.
# Palette: base #191724  surface #1f1d2e  overlay #26233a  muted #6e6a86
#          text #e0def4  love #eb6f92     gold #f6c177     rose #ebbcba
#          pine #31748f  foam #9ccfd8     iris #c4a7e7
set -g status-style 'bg=default fg=#e0def4'
set -g message-style 'bg=#1f1d2e fg=#e0def4'
set -g message-command-style 'bg=#1f1d2e fg=#e0def4'
set -g mode-style 'bg=#26233a fg=#e0def4'

set -g status-left '#[fg=#191724,bg=#c4a7e7,bold] #S #[fg=#c4a7e7,bg=default,nobold] '
set -g status-right '#[fg=#6e6a86]%Y-%m-%d  #[fg=#e0def4]%I:%M %p #[fg=#eb6f92]'

set-window-option -g window-status-format ' #I:#W '
set-window-option -g window-status-current-format ' #I:#W '
set-window-option -g window-status-style 'bg=default fg=#908caa'
set-window-option -g window-status-current-style 'bg=#ebbcba fg=#191724,bold'

set -g pane-border-style 'fg=#26233a'
set -g pane-active-border-style 'fg=#c4a7e7'

set -g status-left-length 40
set -g status-right-length 90
set -g status-interval 5

# --- plugins -----------------------------------------------------------------
# Cloned at pinned commits by the workstation `tmux` role into
# ~/.config/tmux/plugins/ (gitignored). Loaded directly, no TPM. A missing
# plugin is skipped rather than failing the whole config.
#
# Keep this block last: continuum hooks its autosave into status-right, so the
# theme above must already be set when it loads.
set -g @continuum-restore 'on'

if-shell 'test -f ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux' \
    'run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'
if-shell 'test -f ~/.config/tmux/plugins/tmux-continuum/continuum.tmux' \
    'run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux'
